events {}

http {

limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=10r/s;

upstream rails_app {
    least_conn;
    server app:3000 max_fails=3 fail_timeout=10s;
}

upstream grafana_app {
    server grafana:3000 max_fails=3 fail_timeout=10s;
}

upstream prometheus_app {
    server prometheus:9090 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    location /stub_status {
        stub_status;
        allow all;
    }
}

server {
    listen 80;
    server_name app.localhost;

    location /stub_status {
        stub_status;
        allow all;
    }

    location / {
        limit_req zone=ratelimit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://rails_app;

         proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    server_name grafana.localhost;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://grafana_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name prometheus.localhost;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {

        limit_req zone=ratelimit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://prometheus_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

}